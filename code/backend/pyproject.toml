[project]
name = "student-club-backend"
version = "0.1.0"
description = "Django backend for the AI campus student club management system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==5.2.16",
    "mysqlclient==2.2.8",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-django==4.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
